# CPU-bound demo service and a load generator for the CHIMERA quickstart and the EKS run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: {app: billing-service}
  template:
    metadata:
      labels: {app: billing-service}
    spec:
      containers:
        - name: web
          # Every request burns CPU, so load shows up in container_cpu_usage_seconds_total
          image: registry.k8s.io/hpa-example
          ports: [{containerPort: 80}]
          resizePolicy:
            - {resourceName: cpu, restartPolicy: NotRequired}
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: default
spec:
  selector: {app: billing-service}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://billing-service >/dev/null; done"]
