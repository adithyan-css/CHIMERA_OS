apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chimeraautoscalers.autoscaling.k8s.io
spec:
  group: autoscaling.k8s.io
  names:
    kind: ChimeraAutoscaler
    listKind: ChimeraAutoscalerList
    plural: chimeraautoscalers
    singular: chimeraautoscaler
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - scaleTargetRef
              properties:
                scaleTargetRef:
                  type: object
                  required:
                    - apiVersion
                    - kind
                    - name
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                minReplicas:
                  type: integer
                  minimum: 1
                  default: 2
                maxReplicas:
                  type: integer
                  minimum: 1
                  default: 30
                minCPU:
                  type: string
                  default: "500m"
                maxCPU:
                  type: string
                  default: "4000m"
                targetSLO:
                  type: integer
                  default: 200
                ratioCPUToReplicas:
                  type: number
                  default: 0.5
                costWeight:
                  type: number
                  default: 0.1
            status:
              type: object
              properties:
                currentReplicas:
                  type: integer
                currentCPUAllocation:
                  type: string
                lastScaleTime:
                  type: string
                conformalIntervalWidth:
                  type: number
                driftDetected:
                  type: boolean
